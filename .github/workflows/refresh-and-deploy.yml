name: Refresh data and deploy

on:
  schedule:
    # Twice a day: 06:17 and 15:17 America/Chicago in CST (12:17 and 21:17 UTC). Off the hour on purpose.
    - cron: '17 12,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Refresh data from sources
        # The last good data is read from the live site (PREV_URL), so nothing is committed back to the repo.
        # A partial failure still publishes (the site shows which source failed and when it last worked).
        # Exit code 2 = every source failed: the job stops before deploying, the previous deployment stays live,
        # and GitHub emails you about the failed run.
        env:
          PREV_URL: https://shi-qi-li.github.io/bcs-life-radar/data/events.json
        run: npm run refresh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
