name: Refresh data and deploy

on:
  schedule:
    # Twice a day: 06:17 and 15:17 America/Chicago in CST (12:17 and 21:17 UTC). Off the hour on purpose.
    - cron: '17 12,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Decide whether to crawl the sources
        # Scheduled and manual runs always refresh. A push refreshes only when the pipeline or curated data
        # changed; a pure site/docs change reuses the live data so the sources are not crawled again.
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "refresh=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(scripts/|data/|package\.json|\.github/)'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | wc -l)" = "0" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"   # no diff available (first push / force push): be safe
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the live data (site-only change)
        if: steps.decide.outputs.refresh == 'false'
        env:
          PREV_URL: https://shi-qi-li.github.io/bcs-life-radar/data/events.json
        run: curl -fsSL --retry 3 -o public/data/events.json "$PREV_URL" || echo "Live data unavailable; deploying the committed file"
      - name: Refresh data from sources
        if: steps.decide.outputs.refresh != 'false'
        # The last good data is read from the live site (PREV_URL), so nothing is committed back to the repo.
        # A partial failure still publishes (the site shows which source failed and when it last worked).
        # Exit code 2 = every source failed: the job stops before deploying, the previous deployment stays live,
        # and GitHub emails you about the failed run.
        env:
          PREV_URL: https://shi-qi-li.github.io/bcs-life-radar/data/events.json
        run: npm run refresh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
